- description: "tool_choice required selects weather tool"
  vars:
    prompt: "What is the weather in Berlin?"
    tools:
      - type: function
        function:
          name: get_weather
          description: "Get weather for a location"
          parameters:
            type: object
            properties:
              location:
                type: string
            required: [location]
    tool_choice: required
  assert:
    - type: is-json
    - type: contains
      value: "\"get_weather\""
    - type: contains
      value: "\"location\""

- description: "tool_choice none suppresses tool call"
  vars:
    prompt: "What is the weather in Sydney?"
    tools:
      - type: function
        function:
          name: get_weather
          description: "Get weather for a location"
          parameters:
            type: object
            properties:
              location:
                type: string
            required: [location]
    tool_choice: none
  assert:
    - type: equals
      value: "[]"

- description: "multi-tool picks get_time"
  vars:
    prompt: "What time is it in New York right now?"
    tools:
      - type: function
        function:
          name: get_weather
          description: "Get weather for a location"
          parameters:
            type: object
            properties:
              location:
                type: string
            required: [location]
      - type: function
        function:
          name: get_time
          description: "Get current time for a timezone"
          parameters:
            type: object
            properties:
              timezone:
                type: string
            required: [timezone]
  assert:
    - type: is-json
    - type: contains
      value: "\"get_time\""

- description: "typed args bool and int coercion"
  vars:
    prompt: "Search for 'main' case-sensitively, return max 5 results."
    tools:
      - type: function
        function:
          name: search_code
          description: "Search codebase for a pattern"
          parameters:
            type: object
            properties:
              query:
                type: string
              case_sensitive:
                type: boolean
              max_results:
                type: integer
            required: [query]
  assert:
    - type: is-json
    - type: contains
      value: "\"search_code\""
    - type: contains
      value: "\"query\""

- description: "array of objects argument coercion"
  vars:
    prompt: "Ask the user 2 questions: What is your favorite color (red, blue, green) and what is your favorite animal (cat, dog, fish)."
    tools:
      - type: function
        function:
          name: ask_questions
          description: "Ask user multiple-choice questions"
          parameters:
            type: object
            properties:
              questions:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    options:
                      type: array
                      items:
                        type: string
              title:
                type: string
            required: [questions, title]
  assert:
    - type: is-json
    - type: contains
      value: "\"ask_questions\""
    - type: contains
      value: "\"questions\""

- description: "float number coercion"
  vars:
    prompt: "Set the thermostat to 22.5 degrees celsius and enable it."
    tools:
      - type: function
        function:
          name: set_temperature
          description: "Set thermostat temperature"
          parameters:
            type: object
            properties:
              celsius:
                type: number
              enabled:
                type: boolean
            required: [celsius, enabled]
  assert:
    - type: is-json
    - type: contains
      value: "\"set_temperature\""
    - type: contains
      value: "\"celsius\""

- description: "hallucination resistance with similar tools"
  vars:
    prompt: "Create a task to document the grammar constraint feature."
    tools:
      - type: function
        function:
          name: listTasks
          description: "List current tasks"
          parameters:
            type: object
            properties:
              status:
                type: string
      - type: function
        function:
          name: createTask
          description: "Create a new task"
          parameters:
            type: object
            properties:
              content:
                type: string
              priority:
                type: string
            required: [content]
  assert:
    - type: is-json
    - type: contains
      value: "\"createTask\""

- description: "named tool_choice restricts the exposed function"
  vars:
    prompt: "Create an event called Release review."
    tools:
      - type: function
        function:
          name: get_weather
          description: "Get weather for a location"
          parameters:
            type: object
            properties:
              location: {type: string}
            required: [location]
      - type: function
        function:
          name: create_event
          description: "Create a calendar event"
          parameters:
            type: object
            properties:
              title: {type: string}
            required: [title]
    tool_choice:
      type: function
      function:
        name: create_event
  assert:
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        return calls.length === 1 && calls[0].function.name === 'create_event';

- description: "parallel_tool_calls false limits a multi-location request to one call"
  vars:
    prompt: "Call get_weather for Toronto and Vancouver."
    tools:
      - type: function
        function:
          name: get_weather
          description: "Get weather for one location"
          parameters:
            type: object
            properties:
              location: {type: string}
            required: [location]
    tool_choice: required
    parallel_tool_calls: false
  assert:
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        return calls.length === 1 && calls[0].function.name === 'get_weather';

- description: "OpenCode grep schema preserves optional path and include arguments"
  vars:
    prompt: "Use grep to find finalizeAssistantTurn under Sources in Swift files."
    tools:
      - type: function
        function:
          name: grep
          description: "Search files using a regular expression"
          parameters:
            type: object
            properties:
              pattern: {type: string}
              path: {type: string}
              include:
                type: array
                items: {type: string}
            required: [pattern]
    tool_choice: required
  assert:
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const args = calls[0]?.function?.arguments || {};
        return calls.length >= 1 && calls[0].function.name === 'grep' &&
          /finalizeAssistantTurn/.test(String(args.pattern || ''));

- description: "Pi write schema preserves camelCase and multiline Unicode content"
  vars:
    prompt: "Use write to create Notes/café.md with the exact content: line 1, newline, line 2 🚀. Create directories."
    tools:
      - type: function
        function:
          name: write
          description: "Write a file"
          parameters:
            type: object
            properties:
              path: {type: string}
              content: {type: string}
              createDirectories: {type: boolean}
            required: [path, content]
    tool_choice: required
  assert:
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const args = calls[0]?.function?.arguments || {};
        return calls.length === 1 && calls[0].function.name === 'write' &&
          /café\.md$/.test(String(args.path || '')) && /line 2 🚀/.test(String(args.content || ''));

- description: "OpenClaw apply_patch schema preserves a conventional unified diff"
  vars:
    prompt: "Use apply_patch to replace old with new in README.md using a unified diff."
    tools:
      - type: function
        function:
          name: apply_patch
          description: "Apply a patch"
          parameters:
            type: object
            properties:
              input: {type: string}
            required: [input]
    tool_choice: required
  assert:
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const input = String(calls[0]?.function?.arguments?.input || '');
        return calls.length === 1 && calls[0].function.name === 'apply_patch' &&
          (/\*\*\* (?:Begin Patch|Update File: README\.md)/.test(input) ||
           /^diff --git /m.test(input) ||
           (/^--- (?:a\/)?README\.md/m.test(input) && /^\+\+\+ (?:b\/)?README\.md/m.test(input)));

- description: "Hermes todo schema preserves nested task arrays"
  vars:
    prompt: "Use todo to create two tasks: Inspect API and Run tests."
    max_tokens: 1024
    tools:
      - type: function
        function:
          name: todo
          description: "Manage a structured task list"
          parameters:
            type: object
            properties:
              action: {type: string}
              items:
                type: array
                items: {type: string}
            required: [action, items]
    tool_choice: required
  assert:
    - type: javascript
      value: |
        const calls = JSON.parse(output);
        const args = calls[0]?.function?.arguments || {};
        return calls.length === 1 && calls[0].function.name === 'todo' &&
          Array.isArray(args.items) && args.items.length >= 2;
