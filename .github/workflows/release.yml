name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Pin the OS/architecture image. macos-latest is mutable and previously
    # produced host-dependent binaries when combined with -mcpu=native.
    runs-on: macos-26
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Node.js for WebUI
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Use the runner's default Xcode toolchain (Swift 6.x on macos-latest),
    # which is required both for the macOS 26 SDK / Foundation Models APIs and
    # for Package.swift's `swift-tools-version: 6.0` (Swift 6 language mode).
    # Do NOT pin an older swift-actions/setup-swift toolchain: Swift < 6.0
    # cannot build a 6.0 tools-version package, and a swift.org toolchain lacks
    # the FoundationModels framework.
    - name: Build Release Binary
      run: |
        sw_vers
        xcodebuild -version
        swift --version
        ./build.sh --stable --yes

    - name: Build and verify required WebUI artifact
      run: |
        make webui
        Scripts/verify-webui.sh Resources/webui/index.html.gz
    
    - name: Create Release Package
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p release-package

        Scripts/check-macos26-compatibility.sh .build/arm64-apple-macosx/release/afm
        
        # Copy binary with new name
        cp .build/arm64-apple-macosx/release/afm release-package/

        mkdir -p release-package/Resources/webui
        cp Resources/webui/index.html.gz release-package/Resources/webui/
        Scripts/verify-webui.sh release-package/Resources/webui/index.html.gz

        for BUNDLE_NAME in MacLocalAPI_AFMKit.bundle MacLocalAPI_AFMKitMLX.bundle MacLocalAPI_AFMKitDwarfStar.bundle; do
          BUNDLE_DIR=.build/arm64-apple-macosx/release/$BUNDLE_NAME
          test -d "$BUNDLE_DIR"
          cp -r "$BUNDLE_DIR" release-package/
        done
        
        # Copy scripts and docs
        cp test-streaming.sh test-metrics.sh release-package/
        cp README.md LICENSE release-package/ || true

        {
          sw_vers
          xcodebuild -version
          swift --version
          echo "DwarfStar: $(git -C vendor/ds4 rev-parse HEAD)"
        } > release-package/BUILD-ENVIRONMENT.txt
        
        # Create install guide
        cat > release-package/INSTALL.md << EOF
        # afm (Apple Foundation Models API) v$VERSION - Installation Guide
        ## Quick Start
        1. Extract and run: \`chmod +x afm && ./afm\`
        2. Test: \`./test-streaming.sh\`
        ## Requirements
        - macOS 26+ with Apple Intelligence enabled
        EOF
        
        # Create archive
        tar -czf afm-v$VERSION-arm64.tar.gz -C release-package .
        tar -xOzf afm-v$VERSION-arm64.tar.gz ./Resources/webui/index.html.gz > archive-webui.html.gz
        Scripts/verify-webui.sh archive-webui.html.gz
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: afm-v*-arm64.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
